{{ define "main" }}
<style>
    /* Hidden iframe logic */
    #dynamic-shop-collections {
        position: relative;
    }

    .shop-collection-wrapper {
        width: 100%;
        transition: opacity 0.2s ease-in-out;
    }

    .shop-collection-hidden {
        position: absolute !important;
        top: 0;
        left: 0;
        opacity: 0 !important;
        pointer-events: none !important;
        z-index: -10;
        visibility: hidden !important;
    }

    /* Mobile vs Desktop Filter Toggle Logic */
    #mobile-filters-dropdown {
        display: none; /* Hidden on desktop */
        width: 100%; 
        border: 1px solid white;
    }
    
    #desktop-filters-wrapper {
        display: flex; /* Visible on desktop, set to flex */
        flex-wrap: wrap;
        justify-content: flex-start;
    }

    /* Switch to Dropdown on screens smaller than 600px */
    @media (max-width: 600px) {
        #desktop-filters-wrapper {
            display: none !important;
        }
        #mobile-filters-dropdown {
            display: block !important;
        }
    }
</style>

<div class="text-center my-5 text-white">
    <h1 class="lead">Shop</h1>
    <p class="display-4 fw-bold">Loom Merch and More</p>
</div>

<div id="collection-filters" class="mb-5 d-none appear-on-load" style="width: 78%; margin: 0 auto;">
    <div id="desktop-filters-wrapper"></div>
<select id="mobile-filters-dropdown" class="form-select bg-white text-black mx-auto" data-bs-theme="dark"></select></div>

<div id="dynamic-shop-collections"></div>

<div class="d-flex justify-content-center" id="shopify-loader-wrapper">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>

<script type="text/javascript">
    /*<![CDATA[*/
    (function () {
        // ==========================================
        // 1. CONFIGURATION
        // ==========================================
        const SHOP_DOMAIN = 'loom-10204.myshopify.com';
        const ACCESS_TOKEN = '00a81c2274b85efe4342cffca1a3cef5';

        const SHOPIFY_OPTIONS = {
            "product": {
                "styles": {
                    "product": {
                        "@media (max-width: 600px)": { "max-width": "80%", "width": "80%" },
                        "@media (min-width: 600px)": { "width": "48%", "margin-left": "1%", "margin-right": "1%", "margin-bottom": "2%", "min-width": "0px" },
                        "@media (min-width: 768px)": { "width": "31.3%", "margin-left": "1%", "margin-right": "1%" },
                        "@media (min-width: 992px)": { "width": "23%", "margin-left": "1%", "margin-right": "1%" },
                        "@media (min-width: 1200)": { "width": "18%", "margin-left": "1%", "margin-right": "1%" },
                        "text-align": "left", "background-color": "#212529", "border-radius": "15px"
                    },
                    "title": { "font-size": "20px", "color": "#ffffff", "margin-left": "12px", "overflow": "hidden", "text-overflow": "ellipsis", "white-space": "nowrap" },
                    "buttonWrapper": { "margin-left": "12px", "margin-top": "10px", "margin-bottom": "12px" },
                    "button": {
                        "font-weight": "bold", "font-size": "16px", "line-height": "24px", "padding": "4px 16px", "color": "#ffffff", "border": "1px solid #af5613", "margin-left": "12px",
                        ":hover": { "color": "#000000", "background-color": "#af5613" }, "background-color": "#c2601500", ":focus": { "background-color": "#af5613" }, "border-radius": "40px", "padding-left": "18px", "padding-right": "18px"
                    },
                    "quantityInput": { "font-size": "14px", "padding-top": "15px", "padding-bottom": "15px" },
                    "price": { "font-size": "16px", "color": "#ffffff", "margin-left": "12px" },
                    "compareAt": { "font-size": "13.6px", "color": "#ffffff" },
                    "unitPrice": { "font-size": "13.6px", "color": "#ffffff" },
                    "img": { "width": "100%", "aspect-ratio": "1 / 1", "object-fit": "cover", "object-position": "center", "border-radius-top": "15px", "button": true, "buttonDestination": "modal" }
                },
                "buttonDestination": "modal",
                "contents": { "options": false },
                "text": { "button": "View product" },
                "googleFonts": ["Open Sans"]
            },
            "productSet": {
                "styles": {
                    "wrapper": { "@media (min-width: 601px)": { "width": "80%" } },
                    "products": { "@media (min-width: 601px)": { "width": "80%", "margin": "0 auto", "display": "flex", "flex-wrap": "wrap", "justify-content": "flex-start" } }
                }
            },
            "modalProduct": {
                "contents": { "options": true, "img": false, "imgWithCarousel": true, "button": false, "buttonWithQuantity": true },
                "styles": {
                    "product": { "@media (min-width: 601px)": { "max-width": "100%", "margin-left": "0px", "margin-bottom": "0px" }, "background-color": "#ffffff" },
                    "button": {
                        "font-family": "Open Sans, sans-serif", "font-weight": "bold", "font-size": "14px", "padding-top": "15px", "padding-bottom": "15px", "color": "#000000",
                        ":hover": { "color": "#000000", "background-color": "#af5613" }, "background-color": "#c26015", ":focus": { "background-color": "#af5613" }, "border-radius": "40px", "padding-left": "18px", "padding-right": "18px"
                    },
                    "quantityInput": { "font-size": "14px", "padding-top": "15px", "padding-bottom": "15px" },
                    "title": { "font-family": "Helvetica Neue, sans-serif", "font-weight": "bold", "font-size": "26px", "color": "#000000" },
                    "price": { "font-family": "Helvetica Neue, sans-serif", "font-weight": "normal", "font-size": "18px", "color": "#000000" },
                    "compareAt": { "font-family": "Helvetica Neue, sans-serif", "font-weight": "normal", "font-size": "15.3px", "color": "#000000" },
                    "unitPrice": { "font-family": "Helvetica Neue, sans-serif", "font-weight": "normal", "font-size": "15.3px", "color": "#000000" },
                    "description": { "font-family": "Helvetica Neue, sans-serif", "font-weight": "normal", "font-size": "14px", "color": "#000000" }
                },
                "googleFonts": ["Open Sans"], "text": { "button": "Add to cart" }
            },
            "modal": {
                "styles": {
                    "modal": { "background-color": "#ffffff", "border-radius": "15px" },
                    "wrapper": { "background-color": "#ffffff", "border-radius": "15px" }
                }
            },
            "option": {},
            "cart": {
                "styles": {
                    "button": { "font-family": "Open Sans, sans-serif", "font-weight": "bold", "font-size": "14px", "padding-top": "15px", "padding-bottom": "15px", "color": "#000000", ":hover": { "color": "#000000", "background-color": "#af5613" }, "background-color": "#c26015", ":focus": { "background-color": "#af5613" }, "border-radius": "40px" }
                },
                "text": { "total": "Subtotal", "button": "Checkout" }, "googleFonts": ["Open Sans"]
            },
            "toggle": {
                "styles": {
                    "toggle": { "font-family": "Open Sans, sans-serif", "font-weight": "bold", "background-color": "#c26015", ":hover": { "background-color": "#af5613" }, ":focus": { "background-color": "#af5613" } },
                    "count": { "font-size": "14px", "color": "#000000", ":hover": { "color": "#000000" } },
                    "iconPath": { "fill": "#000000" }
                },
                "googleFonts": ["Open Sans"]
            }
        };

        // ==========================================
        // 2. LOAD SHOPIFY SDK
        // ==========================================
        const scriptURL = 'https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js';

        if (window.ShopifyBuy && window.ShopifyBuy.UI) {
            initShopifyComponents();
        } else {
            const script = document.createElement('script');
            script.async = true;
            script.src = scriptURL;
            document.head.appendChild(script);
            script.onload = initShopifyComponents;
        }

        // ==========================================
        // 3. FETCH COLLECTIONS AND BUILD LAYOUT
        // ==========================================
        function initShopifyComponents() {
            const client = ShopifyBuy.buildClient({
                domain: SHOP_DOMAIN,
                storefrontAccessToken: ACCESS_TOKEN,
            });

            ShopifyBuy.UI.onReady(client).then(ui => {

                return client.collection.fetchAll(250).then(collections => {

                    const shopWrapper = document.getElementById('dynamic-shop-collections');
                    const desktopFilterWrapper = document.getElementById('desktop-filters-wrapper');
                    const mobileFilterDropdown = document.getElementById('mobile-filters-dropdown');

                    collections.forEach((col, index) => {
                        const isActive = index === 0;
                        const visibilityClass = isActive ? '' : 'shop-collection-hidden';
                        const btnClass = isActive ? 'btn-light' : 'btn-outline-light';
                        const selectedAttr = isActive ? 'selected' : '';

                        const componentId = `dynamic-col-${index}`;

                        // 1. Generate the Desktop Button (Added me-2 and mb-2 for proper right and bottom spacing)
                        const btnHTML = `
                            <button class="btn ${btnClass} me-2 mb-2 collection-filter-btn" data-target="${componentId}">
                                ${col.title}
                            </button>
                        `;
                        desktopFilterWrapper.insertAdjacentHTML('beforeend', btnHTML);

                        // 2. Generate the Mobile Dropdown Option
                        const optionHTML = `
                            <option value="${componentId}" ${selectedAttr}>
                                ${col.title}
                            </option>
                        `;
                        mobileFilterDropdown.insertAdjacentHTML('beforeend', optionHTML);

                        // 3. Generate the Section Wrapper (Removed the <h2> title tag entirely)
                        const sectionHTML = `
                            <div id="wrapper-${componentId}" class="shop-collection-wrapper mb-5 ${visibilityClass}">
                                <div id="collection-component-${componentId}"></div>
                            </div>
                        `;
                        shopWrapper.insertAdjacentHTML('beforeend', sectionHTML);

                        // Extract the raw numerical ID
                        let rawCollectionId = col.id;
                        try {
                            let decodedId = !rawCollectionId.includes('gid://') ? atob(rawCollectionId) : rawCollectionId;
                            rawCollectionId = decodedId.split('/').pop().replace('?', '');
                        } catch (e) {
                            console.error("Failed to parse Collection ID", e);
                        }

                        // Mount the UI component
                        ui.createComponent('collection', {
                            id: rawCollectionId,
                            node: document.getElementById(`collection-component-${componentId}`),
                            moneyFormat: '%C2%A3%7B%7Bamount%7D%7D',
                            options: SHOPIFY_OPTIONS
                        });
                    });

                    // --- CENTRALIZED SWITCH LOGIC ---
                    function switchCollection(targetId) {
                        // 1. Update buttons
                        document.querySelectorAll('.collection-filter-btn').forEach(b => {
                            if(b.getAttribute('data-target') === targetId) {
                                b.classList.remove('btn-outline-light');
                                b.classList.add('btn-light');
                            } else {
                                b.classList.remove('btn-light');
                                b.classList.add('btn-outline-light');
                            }
                        });

                        // 2. Update dropdown
                        mobileFilterDropdown.value = targetId;

                        // 3. Swap the visible collection wrappers
                        document.querySelectorAll('.shop-collection-wrapper').forEach(wrapper => {
                            wrapper.classList.add('shop-collection-hidden');
                        });
                        document.getElementById(`wrapper-${targetId}`).classList.remove('shop-collection-hidden');
                    }

                    // Attach click listener to desktop buttons
                    document.querySelectorAll('.collection-filter-btn').forEach(btn => {
                        btn.addEventListener('click', function () {
                            switchCollection(this.getAttribute('data-target'));
                        });
                    });

                    // Attach change listener to mobile dropdown
                    mobileFilterDropdown.addEventListener('change', function() {
                        switchCollection(this.value);
                    });
                });

            }).then(() => {
                const loaderWrapper = document.getElementById('shopify-loader-wrapper');
                if (loaderWrapper) {
                    setTimeout(() => {
                        loaderWrapper.remove();
                        document.querySelectorAll('.appear-on-load').forEach(el => el.classList.remove('d-none'));
                    }, 1000);
                }
            }).catch(error => {
                console.error("Failed to load Shopify Collections:", error);
                document.getElementById('shopify-loader-wrapper').innerHTML = `<p class="text-white">Unable to load shop. Please try again later.</p>`;
            });
        }
    })();
    /*]]>*/
</script>
{{ end }}
